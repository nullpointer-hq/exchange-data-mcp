[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exchange-data-mcp"
version = "0.1.0"
description = "Read-only crypto market data for AI agents: normalized across exchanges, shaped for LLM context, no API keys."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0"]

[project.scripts]
exchange-data-mcp = "exchange_data_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
